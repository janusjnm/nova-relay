name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No secrets, no services. The [real-runtime] bwrap tests skip themselves (with the probe's
      # reason) where bubblewrap or unprivileged user namespaces are unavailable.
      - run: npm test
